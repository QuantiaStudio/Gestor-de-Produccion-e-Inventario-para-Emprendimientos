<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../css/dashboard-admin.css" />
    <title>Dashboard</title>
</head>

<body>
    <main>
        <header>
            <div class="header-content">
                <svg class="icon" aria-hidden="true">
                    <use href="../assets/list.svg"></use>
                </svg>
                <span class="text">Dashboard</span>
            </div>
            <div class="user-info">
                <img src="../assets/avatar.jpg" alt="Logo de la aplicación" class="user-avatar" />
                <span class="text-name">Admin</span>
                <span class="text-rol"> Administrador</span>
            </div>
        </header>


        <div class="content">
            <div class="alerts-container">
                <div class="card">
                    <div class="card-summary">
                        <span class="card-icon">
                            <svg viewBox="0 0 16 16" aria-hidden="true">
                                <use href="../assets/people.svg"></use>
                            </svg>
                        </span>
                        <span class="card-summary-text">
                            <span class="alert-type">Usuarios Totales</span>
                            <span class="alert-num">50</span>
                        </span>
                    </div>

                    <div class="card-detail">
                        <span class="alert-description">Usuarios registrados en el sistema</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-summary">
                        <span class="card-icon">
                            <svg viewBox="0 0 16 16" aria-hidden="true">
                                <use href="../assets/clipboard-check.svg"></use>
                            </svg>
                        </span>
                        <span class="card-summary-text">
                            <span class="alert-type">Ordenes de Producción</span>
                            <span class="alert-num">80</span>
                        </span>
                    </div>

                    <div class="card-detail">
                        <span class="alert-insight">
                            <svg class="icon" aria-hidden="true">
                                <use href="../assets/arrow-up.svg"></use>
                            </svg>
                            <span>15% más que el mes anterior</span>
                        </span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-summary">
                        <span class="card-icon">
                            <svg viewBox="0 0 16 16" aria-hidden="true">
                                <use href="../assets/box.svg"></use>
                            </svg>
                        </span>
                        <span class="card-summary-text">
                            <span class="alert-type">Productos</span>
                            <span class="alert-num">30</span>
                        </span>
                    </div>

                    <div class="card-detail">
                        <span class="alert-insight">
                            <svg class="icon" aria-hidden="true">
                                <use href="../assets/arrow-up.svg"></use>
                            </svg>
                            <span>10% menos que el mes anterior</span>
                        </span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-summary">
                        <span class="card-icon">
                            <svg viewBox="0 0 16 16" aria-hidden="true">
                                <use href="../assets/bricks.svg"></use>
                            </svg>
                        </span>
                        <span class="card-summary-text">
                            <span class="alert-type">Materia Prima</span>
                            <span class="alert-num">100</span>
                        </span>
                    </div>

                    <div class="card-detail">
                        <span class="alert-insight">
                            <svg class="icon" aria-hidden="true">
                                <use href="../assets/arrow-up.svg"></use>
                            </svg>
                            <span>10% más que el mes anterior</span>
                        </span>
                    </div>
                </div>
            </div>
            <div class="graphics-container">
                <div class="graphic-histogram">
                    <img src="../assets/histo-prod.png" alt="histograma de ventas" class="graphic-img graphic-img-histogram" />
                </div>
                <div class="graphic-cake">
                    <img src="../assets/chart-prod.png" alt="grafico de torta de producción" class="graphic-img graphic-img-cake" />
                </div>
            </div>
        </div>


        <aside>
            <div class="sidebar">
                <div class="sidebar-header">
                    <img src="../assets/logo.png" alt="Logo de la aplicación" class="sidebar-logo" />
                    <span class="rol">ADMIN</span>
                </div>
                <a href="" class="sidebar-link">
                    <svg class="icon" aria-hidden="true">
                        <use href="../assets/house-door.svg"></use>
                    </svg>
                    <span class="text">Dashboard</span>
                </a>
                <a href="" class="sidebar-link">
                    <svg class="icon" aria-hidden="true">
                        <use href="../assets/people.svg"></use>
                    </svg>
                    <span class="text">Usuarios</span>
                </a>
                <a href="" class="sidebar-link">
                    <svg class="icon" aria-hidden="true">
                        <use href="../assets/bag.svg"></use>
                    </svg>
                    <span class="text">Productos</span>
                </a>
                <a href="" class="sidebar-link">
                    <svg class="icon" aria-hidden="true">
                        <use href="../assets/bar-chart-line.svg"></use>
                    </svg>
                    <span class="text">Reportes</span>
                </a>

            </div>
        </aside>
    </main>
    <footer>Contenido del Footer</footer>
</body>

</html>
