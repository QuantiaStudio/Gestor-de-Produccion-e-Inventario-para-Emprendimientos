<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProdManager - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>PRODMANAGER</h1>
                <p>Ingresa tus credenciales para continuar.</p>
            </div>

            <form action="home.html" method="GET" class="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="text" id="email" placeholder="ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>

                <div class="form-actions">
                    <a href="register.html" class="alt-link">Crear cuenta</a>
                    <button type="submit" class="btn-primary">Ingresar</button>
                </div>

                <div class="login-footer">
                    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
