<!-- Descomentar para que el modal se cierre al hacer clic fuera de él -->
<!-- <div class="modal fade" id="modalCrear" role="dialog" tabindex="-1" aria-labelledby="modalCrearLabel"
    aria-hidden="true"> -->
<div class="modal show d-block" id="modalCrear" role="dialog" tabindex="-1" aria-labelledby="modalCrearLabel"
    aria-hidden="false">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content card">

            <div class="modal-header border-0 pb-0 d-flex justify-content-between align-items-center">
                <h2 class="modal-title fw-bold text-gray-900 fs-5" id="modalCrearLabel">
                    Registrar Nuevo Producto
                </h2>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">

                <form id="formRegistrar">

                    <!-- Código -->
                    <div class="mb-3">
                        <label for="regCodigo" class="form-label mb-1">
                            Código
                        </label>

                        <input type="text" class="input" id="regCodigo" placeholder="Ej: PT-002" required>
                    </div>

                    <!-- Nombre -->
                    <div class="mb-3">
                        <label for="regNombre" class="form-label mb-1">
                            Nombre
                        </label>

                        <input type="text" class="input" id="regNombre" placeholder="Nombre del producto" required>
                    </div>

                    <!-- Categoría -->
                    <div class="row g-3 mb-3">

                        <div class="col-md-6">

                            <label for="regCategoria" class="form-label mb-1">
                                Categoría
                            </label>

                            <select class="input form-select" id="regCategoria" required>

                                <option value="">Seleccionar...</option>
                                <option>Mesas</option>
                                <option>Escritorios</option>
                                <option>Decks</option>
                                <option>Cómodas</option>
                                <option>Bibliotecas</option>
                                <option>Banquetas</option>
                                <option>Sillas</option>

                            </select>

                            <div class="mt-1">
                                <a href="#collapseNuevaCategoria" class="text-decoration-none" data-bs-toggle="collapse"
                                    role="button">

                                    + Nueva categoría

                                </a>
                            </div>

                        </div>

                    </div>

                    <!-- Nueva Categoría -->
                    <div class="collapse" id="collapseNuevaCategoria">

                        <div class="mb-3">

                            <label for="regNuevaCategoria" class="form-label mb-1">
                                Nombre de la nueva categoría
                            </label>

                            <input type="text" class="input" id="regNuevaCategoria" placeholder="Categoría">

                        </div>

                    </div>

                    <!-- Stock -->
                    <div class="row g-3 mb-3">

                        <div class="col-md-6">

                            <label for="regStock" class="form-label mb-1">
                                Stock Inicial
                            </label>

                            <input type="number" class="input" id="regStock" min="0" placeholder="0" required>

                        </div>

                    </div>

                    <!-- Descripción -->
                    <div class="mb-4">

                        <label for="regDescripcion" class="form-label mb-1">
                            Descripción
                        </label>

                        <textarea class="input" id="regDescripcion" rows="3"
                            placeholder="Breve descripción del producto..."></textarea>

                    </div>

                    <!-- Materiales Requeridos -->
                    <div class="mb-4">

                        <label class="form-label mb-2">
                            Materiales Requeridos
                        </label>

                        <div class="row g-2 align-items-end mb-3">

                            <div class="col-md-6">

                                <label for="materialSelect" class="form-label mb-1">
                                    Material
                                </label>

                                <select class="input form-select" id="materialSelect">

                                    <option value="">Seleccionar material...</option>
                                    <option>Tablero MDF 18 mm</option>
                                    <option>Patas de pino cepillado</option>
                                    <option>Tornillos para madera 3.5x16 mm</option>
                                    <option>Adhesivo para madera</option>
                                    <option>Barniz transparente</option>

                                </select>

                                <small class="text-muted">
                                    Stock disponible: 120 unidades
                                </small>

                            </div>

                            <div class="col-md-3">

                                <label for="materialCantidad" class="form-label mb-1">
                                    Cantidad
                                </label>

                                <input type="number" min="1" class="input" id="materialCantidad" placeholder="0">

                            </div>

                            <div class="col-md-3">

                                <button type="button" class="btn btn-primary w-100">

                                    Agregar

                                </button>

                            </div>

                        </div>

                        <div class="materials-container">

                            <table class="table align-middle mb-0">

                                <thead>

                                    <tr>
                                        <th>Material</th>
                                        <th>Cantidad</th>
                                        <th>Unidad</th>
                                        <th></th>
                                    </tr>

                                </thead>

                                <tbody id="materialesTableBody">

                                    <tr>
                                        <td>Tablero MDF 18 mm</td>
                                        <td>1</td>
                                        <td>unidad</td>
                                        <td>
                                            <button type="button" class="btn btn-sm btn-outline-danger">
                                                Eliminar
                                            </button>
                                        </td>
                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                    <!-- Botones -->
                    <div class="d-flex justify-content-end gap-2 mt-4">

                        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">

                            Cancelar

                        </button>

                        <button type="submit" class="btn btn-primary">

                            Guardar

                        </button>

                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
