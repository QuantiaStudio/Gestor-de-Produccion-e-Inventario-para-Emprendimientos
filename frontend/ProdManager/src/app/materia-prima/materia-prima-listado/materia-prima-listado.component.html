<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Material</th>
      <th>Categoría</th>
      <th>Cantidad</th>
      <th>Estado</th>
    </tr>
  </thead>
  <tbody>
    @for (mp of materiasPrimas; track mp.id) {
      <tr>
        <td>#{{ mp.id }}</td>
        <td>{{ mp.nombre }}</td>
        <td>{{ mp.categoria }}</td>
        <td>{{ mp.cantidad }} {{ mp.unidadMedida }}</td>
        <td>{{ mp.estado }}</td>
      </tr>
    }
  </tbody>
</table>
