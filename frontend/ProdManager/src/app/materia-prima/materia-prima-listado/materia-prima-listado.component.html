<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Categoría</th>
      <th>Unidad</th>
      <th>Stock disponible</th>
      <th>Estado</th>
    </tr>
  </thead>
  <tbody>
    @for (mp of materiasPrimas; track mp.id) {
      <tr>
        <td>{{ mp.nombre }}</td>
        <td>{{ mp.categoria }}</td>
        <td>{{ mp.unidadMedida }}</td>
        <td>{{ mp.stockDisponible }}</td>
        <td>{{ mp.estado }}</td>
      </tr>
    }
  </tbody>
</table>
